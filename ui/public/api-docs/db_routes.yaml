            application/json:
              schema:
                $ref: "./schemas.yaml#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "./schemas.yaml#/components/schemas/Error"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "./schemas.yaml#/components/schemas/Error"
  /db/editAdditionalInfo:
    post:
      summary: Edit additional info
      description: Edit additional info for student
      tags:
        - DB
      operationId: editAdditionalInfo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: string
                  description: User ID
                  example: "def123"
                additional_info:
                  type: string
                  description: Additional info
                  example: "I like to play video games"

      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: string
                example: "Additional info updated successfully"
        "400":
