    get:
      summary: Get additional info
      description: Get additional info for student
      tags:
        - DB
      operationId: getAdditionalInfo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: string
              description: User System ID
              example: "def123"
      responses:
        "200":
