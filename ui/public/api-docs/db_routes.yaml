  # User Management
  /db/createUser:
    post:
      summary: Create a user
      description: Create a user
      tags:
        - DB
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas.yaml#/components/schemas/Users"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "./schemas.yaml#/components/schemas/Users"
        "400":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "./schemas.yaml#/components/schemas/Error"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "./schemas.yaml#/components/schemas/Error"

