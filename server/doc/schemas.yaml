components:
  schemas:
    ActionLog:
      type: object
      properties:
        action_log_id:
          type: integer
        submission_datetime:
          type: string
          format: date-time
        action_template:
          type: integer
        system_id:
          type: string
        mock_id:
          type: string
          nullable: true
        project:
          type: integer
        form_data:
          type: string
          nullable: true
        files:
          type: string
          nullable: true

    Actions:
      type: object
      properties:
        action_id:
          type: integer
        semester:
          type: integer
        action_title:
          type: string
        action_target:
          type: string
        date_deleted:
          type: string
          nullable: true
        short_desc:
          type: string
        start_date:
          type: string
        due_date:
          type: string
        page_html:
          type: string
        file_types:
          type: string
          nullable: true
        file_size:
          type: integer

    Archive:
      type: object
      properties:
        archive_id:
          type: integer
        project_id:
          type: integer
        priority:
          type: integer
          default: 0
        csv:
          type: string
        name:
          type: string
        dept:
          type: string
        start_date:
          type: string
        end_date:
          type: string
        featured:
          type: integer
          default: 0
        outstanding:
          type: integer
          default: 0
        creative:
          type: integer
          default: 0
        title:
          type: string
        team_name:
          type: string
        members:
          type: string
        sponsor:
          type: string
        coach:
          type: string
        poster_thumb:
          type: string
        poster_full:
          type: string
        archive_image:
          type: string
        synopsis:
          type: string
        keywords:
          type: string
        url_slug:
          type: string
        video:
          type: string
        inactive:
          type: string
          default: ""
        locked:
          type: string
          default: ""

    PageHtml:
      type: object
      properties:
        html_id:
          type: integer
        name:
          type: string
        html:
          type: string

    ProjectCoaches:
      type: object
      properties:
        project_id:
          type: string
        coach_id:
          type: string

    Projects:
      type: object
      properties:
        project_id:
          type: integer
        submission_datetime:
          type: string
          format: date-time
        status:
          type: string
        display_name:
          type: string
        title:
          type: string
        organization:
          type: string
        primary_contact:
          type: string
        contact_email:
          type: string
        contact_phone:
          type: string
        attachments:
          type: string
        background_info:
          type: string
        project_description:
          type: string
        project_scope:
          type: string
        project_challenges:
          type: string
        constraints_assumptions:
          type: string
        sponsor_provided_resources:
          type: string
        project_search_keywords:
          type: string
        sponsor_deliverables:
          type: string
        proprietary_info:
          type: string
        sponsor_avail_checked:
          type: integer
        sponsor_alternate_time:
          type: string
        project_agreements_checked:
          type: integer
        assignment_of_rights:
          type: string
        team_name:
          type: string
        poster:
          type: string
        video:
          type: string
        website:
          type: string
        synopsis:
          type: string
        sponsor:
          type: integer
        semester:
          type: integer

    SemesterGroup:
      type: object
      properties:
        semester_id:
          type: integer
        name:
          type: string
        dept:
          type: string
        start_date:
          type: string
        end_date:
          type: string

    SponsorNotes:
      type: object
      properties:
        sponsor_note_id:
          type: integer
        creation_date:
          type: string
          format: date-time
        note_content:
          type: string
        sponsor:
          type: integer
        author:
          type: string
        previous_note:
          type: integer
          nullable: true

    Sponsors:
      type: object
      properties:
        sponsor_id:
          type: integer
        fname:
          type: string
        lname:
          type: string
        company:
          type: string
        division:
          type: string
        email:
          type: string
        phone:
          type: string
        association:
          type: string
        type:
          type: string
        notes:
          type: string
        inActive:
          type: integer
          default: 0
        doNotEmail:
          type: integer
          default: 0

    TimeLog:
      type: object
      properties:
        time_log_id:
          type: integer
        semester:
          type: integer
        submission_datetime:
          type: string
          format: date-time
        system_id:
          type: string
        project:
          type: string
        mock_id:
          type: string
          nullable: true
        work_date:
          type: string
        time_amount:
          type: integer
        work_comment:
          type: string
        active:
          type: integer
          default: 1

    Users:
      type: object
      properties:
        system_id:
          type: string
        fname:
          type: string
        lname:
          type: string
        email:
          type: string
        type:
          type: string
        semester_group:
          type: integer
        project:
          type: string
        active:
          type: string
