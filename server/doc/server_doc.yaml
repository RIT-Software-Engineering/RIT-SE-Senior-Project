openapi: '3.0.3'
info:
  title: SE Senior Project Backend Documentation
  version: '1.7.0'

servers:
  - url: https://seniorproject.se.rit.edu/
    description: Production
  - url: https://seniorproject-sandbox.se.rit.edu/
    description: Sandbox (Runs most recent dev branch release)
  - url: http://localhost:3000
    description: Local

components:
